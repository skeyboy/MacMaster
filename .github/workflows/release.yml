# 打包并发版：一条命令链与本地逐字相同（make-app.sh → package-app.sh），差别只在跑在谁家的机器上。
#
# 三种触发：
#   1. workflow_dispatch —— 手动点一次，能选版本号、构建号、目标 Release，也能选只出产物不上传；
#   2. push tags `v*`   —— 推一个 `v1.0.0` 就自动构建、自动建 Release 并把附件挂上去；
#   3. release published —— 在网页上手工建的 Release 由草稿转正式发布时，同样自动补附件。
#
# 这一条流水线**证的是可复现构建与附件完好**，它不替代 `docs/analysis/release-readiness.md`
# §10 第 3 步那三张实机照片：runner 上没有窗口服务器、也没有真实的 `~/Library`，
# 那些照片只能在作者这台机器上拍。CI 日志里没有它们，就不要当成"跑过了"。
#
# 附件档仍是 ad-hoc 签名、未公证（`package-app.sh` 会把 `spctl` 那一行原样打进日志），
# 所以 Release 页面上的包只适合仓库协作者与自查，不适合发给陌生人。
name: 打包并发版

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString（写进产物 plist）
        type: string
        default: '1.0.0'
        required: true
      build:
        description: CFBundleVersion（同一版本号重复发版时递增这一个）
        type: string
        default: '1'
        required: true
      tag:
        description: 附件挂到哪个 Release（不存在就按这个 tag 新建）
        type: string
        default: 'v1.0.0'
        required: true
      run_tests:
        description: 打包前先跑九包全量单测（条数以 docs/analysis/release-readiness.md §1 那一格为准，这里不挂数）
        type: boolean
        default: true
      upload:
        description: 把 zip/dmg 传到那个 Release（关掉就只留 Actions 产物下载）
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 构建并打包（macOS latest arm64）
    # **这一格换过一次机器**：原先写 `macos-14`，理由是"产物要求 macOS 14"——那句推理是错的。
    # `LSMinimumSystemVersion=14.0` 说的是**跑**的最低系统，而 runner 的镜像决定的是
    # **编**的工具链。macos-14 镜像带 Xcode 15.4 / Swift 5.10（run 37723769898 第 4 步原文），
    # 而作者的构建机是 Xcode 27 / Swift 6.4：三个包（MMDisk、MMMonitor、MMGuardian）在 5.10 下
    # 直接编不过，第 5 步因此红，六包合计 407 条而不是 633 条。报错原文与处置记在
    # `docs/analysis/release-readiness.md` §8「工具链那一档」。
    # 现在用 `macos-latest`（GitHub 当前 GA 的 macOS 26 arm64；`macos-14` 已标 deprecated）。
    # 换镜像**没有**放宽任何闸门：第 5 步还是九包全量、第 8 步还是 package-app.sh 自校验，
    # 产物的最低系统仍由 `Package.swift:6` 的 `.macOS(.v14)` 与 plist 说了算，不是 runner 的
    # `sw_vers` 说了算——第 4 步把那四个数（系统、Xcode、Swift、arch）原样打进日志就是为了这件事。
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 取码
        uses: actions/checkout@v4

      # tag 与 release 两种触发只有一个版本号来源——tag 本身；手动触发才是输入框。
      # 这里把它折成 VERSION / BUILD_NO 两个环境变量，后面每一步只认这两个。
      # 不写下来的话，`1.0.0` 与 `1` 会在三个 step 里各拼一次，改一版就得改三处。
      - name: 定档版本号与 tag
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_BUILD: ${{ github.event.inputs.build }}
          IN_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              VERSION="$IN_VERSION"; BUILD_NO="$IN_BUILD"; TAG="$IN_TAG" ;;
            push)
              TAG="$REF_NAME"; VERSION="${REF_NAME#v}"; BUILD_NO=1 ;;
            release)
              TAG="$RELEASE_TAG"; VERSION="${RELEASE_TAG#v}"; BUILD_NO=1 ;;
            *)
              echo "没为触发方式 $EVENT 定过版本号"; exit 2 ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 形态不对：$TAG（要 v1.2.3 或 v1.2.3-rc1 这样）"; exit 2
          fi
          # 先赋给 shell 自己的变量，再往 $GITHUB_ENV 里写一行。
          # 反过来写（只在 heredoc 里现算）会让下一行的 `$PRERELEASE` 在 `set -u` 下未定义。
          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NO=$BUILD_NO"
            echo "TAG=$TAG"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "这一跑要发的是 $TAG → MacMaster $VERSION ($BUILD_NO)，prerelease=$PRERELEASE"

      # 构建机的型号与 SDK 要留在日志里：SMC 温度那一档能不能读到取决于 runner 的机型与系统版本
      # （见 release-readiness §8 那条 SDK 单列档）；而工具链版本决定九包能不能编过（见上面
      # `runs-on` 那一格）。**这两个数都不是产物的最低系统**——那一个由 `Package.swift` 与 plist 定。
      - name: 记构建环境
        run: |
          sw_vers
          echo "arch=$(uname -m)"
          xcodebuild -version
          swift --version

      # 自动触发时单测是闸门，不是可选项：附件一挂上 Release 就成了"别人下载的那一份"。
      # 原始逐包日志落在另一个目录再拷进来，是因为 `run-all-tests.sh` 开头会 `rm -rf $LOG`——
      # 直接把 tee 的目标写进那个目录，文件会在被写之前就被删掉，产物里只剩一个空壳。
      #
      # **这一格在 run 37723769898 上翻过一次车**：runner 每个 step 都跑在
      # `/bin/bash -e -o pipefail` 下，`run-all-tests.sh` 有包失败时退出 1，那条管道一非零
      # 整个 step 当场结束，写在后面的 `cp` 从来没执行过——产物里只有 `summary.txt`（833 B，
      # 就是 tee 那一份），恰恰在最需要原始日志的那一跑没有原始日志。所以现在是
      # "先收退出码 → 该留的都留下 → 最后才 exit"，顺序不能倒。
      - name: 九包全量单测
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: |
          mkdir -p build/testlogs
          status=0
          LOG="$PWD/build/.tests-raw" ./Scripts/run-all-tests.sh | tee build/testlogs/summary.txt || status=$?
          # 失败时把逐包原始日志的末尾直接打进主日志：主日志不用下载，是人第一眼看到的地方。
          if [[ "$status" != 0 ]]; then
            for f in build/.tests-raw/*.log; do
              [[ -f "$f" ]] || continue
              echo "===== $(basename "$f")：末尾 40 行 ====="
              tail -40 "$f"
            done
          fi
          cp build/.tests-raw/*.log build/testlogs/ 2>/dev/null || echo "逐包原始日志目录是空的"
          echo "run-all-tests.sh 退出码：$status"
          exit "$status"

      - name: 留一份单测日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ github.run_number }}
          path: build/testlogs/
          if-no-files-found: ignore

      - name: 构建 .app
        run: VERSION="$VERSION" BUILD="$BUILD_NO" ./Scripts/make-app.sh

      - name: 打成 zip 与 dmg，并当场验一遍
        run: VERSION="$VERSION" BUILD="$BUILD_NO" ./Scripts/package-app.sh

      - name: 留安装包本身（Actions 产物，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: MacMaster-${{ env.VERSION }}-${{ env.BUILD_NO }}-assets
          path: build/dist/MacMaster-${{ env.VERSION }}-${{ env.BUILD_NO }}-*
          if-no-files-found: error
          retention-days: 30

      # `gh release create` 与 `gh release upload` 分开两步是有理由的：
      # 手动重跑同一版时 Release 多半已经存在，这时只该覆盖附件，不该报"tag 已有 Release"。
      - name: 建 Release（缺就建）
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接补附件"
          else
            NOTES=(--notes "MacMaster $VERSION ($BUILD_NO)：本条由 GitHub Actions 打包（ad-hoc 签名、未公证）。")
            [[ -f RELEASE-NOTES.md ]] && NOTES=(--notes-file RELEASE-NOTES.md)
            FLAGS=(--target "$GITHUB_SHA" --title "MacMaster $VERSION")
            [[ "$PRERELEASE" == true ]] && FLAGS+=(--prerelease)
            gh release create "$TAG" "${NOTES[@]}" "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
          fi

      - name: 上传附件
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "build/dist/MacMaster-$VERSION-$BUILD_NO.zip" \
            "build/dist/MacMaster-$VERSION-$BUILD_NO.dmg" \
            "build/dist/MacMaster-$VERSION-$BUILD_NO-SHA256SUMS.txt" \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "已挂上 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
